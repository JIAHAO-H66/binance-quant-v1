<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quant V1 · 山寨币合约回测</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",
    "Helvetica Neue",Arial,sans-serif;
  color:#111;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 16px #0000000d;
}

h1{
  font-size:25px;
  margin:4px 0 8px;
}

h2{
  margin:4px 0 14px;
}

h3{
  margin-top:0;
}

.muted{
  color:#70757d;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  font-size:17px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.metric{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.m{
  background:#f1f2f4;
  border-radius:13px;
  padding:14px;
}

.v{
  font-size:22px;
  font-weight:700;
  margin-top:5px;
}

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:14px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#111;
  transition:width .25s;
}

.coin{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.coin:last-child{
  border-bottom:0;
}

.ok{
  color:#198754;
}

.fail{
  color:#d93025;
}

.running{
  color:#555;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:13px;
  line-height:1.5;
  margin:0;
}

.small{
  font-size:13px;
  color:#70757d;
}

@media(max-width:500px){
  .wrap{
    padding:12px;
  }

  .card{
    padding:16px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- 标题 -->
  <div class="card">

    <h1>Quant V1 · 山寨币合约回测</h1>

    <div class="muted">
      Binance USDT 永续 · 4H · 多空 · 公开行情数据 · 不下单
    </div>

    <br>

    <button id="go" onclick="run()">
      开始回测
    </button>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </div>


  <!-- 总结果 -->
  <div class="card">

    <div id="status" class="muted">
      等待开始
    </div>

    <div class="metric">

      <div class="m">
        交易次数
        <div class="v" id="trades">—</div>
      </div>

      <div class="m">
        胜率
        <div class="v" id="win">—</div>
      </div>

      <div class="m">
        组合收益
        <div class="v" id="ret">—</div>
      </div>

      <div class="m">
        币种
        <div class="v" id="coins">—</div>
      </div>

    </div>

  </div>


  <!-- 币种结果 -->
  <div class="card">

    <h2>币种回测结果</h2>

    <div id="results">
      <div class="small">
        点击“开始回测”后显示结果
      </div>
    </div>

  </div>


  <!-- 策略 -->
  <div class="card">

    <h2>策略</h2>

    <pre>EMA50 / EMA200 趋势
20 根 4H 动量
ATR 1.5 倍止损
多空双向
基础手续费模拟 0.1%

仅用于研究，不代表未来收益</pre>

  </div>

</div>


<script>

/*
 * 回测币种
 */
const symbols = [
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "AVAXUSDT",
  "LINKUSDT",
  "SUIUSDT",
  "APTUSDT",
  "NEARUSDT",
  "INJUSDT"
];


/*
 * EMA
 */
function ema(a, n){

  if(!a.length){
    return [];
  }

  const k = 2 / (n + 1);

  let e = a[0];

  const out = [e];

  for(let i = 1; i < a.length; i++){

    e = a[i] * k + e * (1 - k);

    out.push(e);
  }

  return out;
}


/*
 * ATR
 *
 * 使用 True Range。
 */
function atr(data, n = 14){

  const out = new Array(data.length).fill(NaN);

  for(let i = 1; i < data.length; i++){

    const prevClose = data[i - 1].close;

    const tr = Math.max(
      data[i].high - data[i].low,
      Math.abs(data[i].high - prevClose),
      Math.abs(data[i].low - prevClose)
    );

    data[i]._tr = tr;
  }

  for(let i = n; i < data.length; i++){

    let sum = 0;

    for(let j = i - n + 1; j <= i; j++){
      sum += data[j]._tr || 0;
    }

    out[i] = sum / n;
  }

  return out;
}


/*
 * 单币种回测
 */
function calc(data){

  if(!data || data.length < 220){
    return [];
  }

  const c = data.map(x => x.close);

  const e50 = ema(c, 50);

  const e200 = ema(c, 200);

  const a = atr(data, 14);

  const trades = [];

  let pos = 0;

  let entry = 0;

  /*
   * 从 200 根以后开始，
   * 保证 EMA200 有足够数据。
   */
  for(let i = 200; i < data.length; i++){

    if(!Number.isFinite(a[i])){
      continue;
    }

    /*
     * 20 根 4H 动量
     */
    const mom =
      c[i] / c[i - 20] - 1;

    /*
     * 没有持仓
     */
    if(pos === 0){

      /*
       * 做多
       */
      if(
        e50[i] > e200[i] &&
        mom > 0
      ){

        pos = 1;

        entry = c[i];

        continue;
      }

      /*
       * 做空
       */
      if(
        e50[i] < e200[i] &&
        mom < 0
      ){

        pos = -1;

        entry = c[i];

        continue;
      }
    }


    /*
     * 多单
     */
    if(pos === 1){

      const stop =
        entry - 1.5 * a[i];

      const trendBroken =
        !(e50[i] > e200[i] && mom > 0);

      const stopHit =
        c[i] <= stop;

      if(stopHit || trendBroken){

        const gross =
          (c[i] - entry) / entry;

        const net =
          gross - 0.001;

        trades.push({
          side:"LONG",
          entry:entry,
          exit:c[i],
          ret:net
        });

        pos = 0;

        entry = 0;
      }
    }


    /*
     * 空单
     */
    else if(pos === -1){

      const stop =
        entry + 1.5 * a[i];

      const trendBroken =
        !(e50[i] < e200[i] && mom < 0);

      const stopHit =
        c[i] >= stop;

      if(stopHit || trendBroken){

        const gross =
          (entry - c[i]) / entry;

        const net =
          gross - 0.001;

        trades.push({
          side:"SHORT",
          entry:entry,
          exit:c[i],
          ret:net
        });

        pos = 0;

        entry = 0;
      }
    }
  }

  return trades;
}


/*
 * 从服务器读取 Binance 数据
 */
async function get(symbol){

  const url =
    "/api/klines" +
    "?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=4h" +
    "&limit=1000";

  const response =
    await fetch(url, {
      method:"GET",
      cache:"no-store"
    });

  let result;

  try{
    result = await response.json();
  }catch{
    throw new Error(
      symbol + "：服务器返回格式错误"
    );
  }

  if(!response.ok || !result.ok){

    throw new Error(
      result.error ||
      symbol + " HTTP " + response.status
    );
  }

  if(
    !Array.isArray(result.data) ||
    result.data.length === 0
  ){

    throw new Error(
      symbol + "：没有行情数据"
    );
  }

  return result.data;
}


/*
 * 显示币种状态
 */
function addResult(symbol, text, cls){

  const box =
    document.getElementById("results");

  const row =
    document.createElement("div");

  row.className = "coin";

  const name =
    document.createElement("div");

  name.textContent = symbol;

  const status =
    document.createElement("div");

  status.className = cls || "";

  status.textContent = text;

  row.appendChild(name);

  row.appendChild(status);

  box.appendChild(row);
}


/*
 * 主回测
 */
async function run(){

  const button =
    document.getElementById("go");

  const status =
    document.getElementById("status");

  const results =
    document.getElementById("results");

  const progress =
    document.getElementById("progressBar");


  button.disabled = true;

  button.textContent =
    "正在回测……";

  results.innerHTML = "";

  progress.style.width = "0%";


  /*
   * 重置统计
   */
  document.getElementById("trades").textContent = "—";

  document.getElementById("win").textContent = "—";

  document.getElementById("ret").textContent = "—";

  document.getElementById("coins").textContent =
    "0/" + symbols.length;


  const allTrades = [];

  let success = 0;


  /*
   * 一个一个币种处理
   */
  for(let i = 0; i < symbols.length; i++){

    const symbol = symbols[i];

    status.textContent =
      "正在读取 " +
      symbol +
      " ……";


    /*
     * 先显示读取中
     */
    addResult(
      symbol,
      "读取中……",
      "running"
    );

    const rows =
      results.querySelectorAll(".coin");

    const currentRow =
      rows[rows.length - 1];

    const currentStatus =
      currentRow.children[1];


    try{

      /*
       * 获取行情
       */
      const data =
        await get(symbol);


      /*
       * 回测
       */
      const trades =
        calc(data);


      /*
       * 合并
       */
      for(const t of trades){
        allTrades.push(t);
      }


      success++;


      currentStatus.textContent =
        "成功 · " +
        data.length +
        " 根K线 · " +
        trades.length +
        " 笔交易";

      currentStatus.className =
        "ok";


    }catch(err){

      currentStatus.textContent =
        "失败：" +
        err.message;

      currentStatus.className =
        "fail";
    }


    /*
     * 更新进度
     */
    const percent =
      ((i + 1) / symbols.length) * 100;

    progress.style.width =
      percent + "%";


    document.getElementById("coins").textContent =
      success + "/" + symbols.length;
  }


  /*
   * 组合收益
   *
   * 每笔交易复利计算。
   */
  let equity = 1;

  for(const trade of allTrades){

    equity *=
      1 + trade.ret;
  }


  /*
   * 胜率
   */
  const wins =
    allTrades.filter(
      x => x.ret > 0
    ).length;


  const winRate =
    allTrades.length
      ? wins / allTrades.length
      : 0;


  /*
   * 显示结果
   */
  document.getElementById("trades").textContent =
    allTrades.length;


  document.getElementById("win").textContent =
    allTrades.length
      ? (winRate * 100).toFixed(1) + "%"
      : "—";


  document.getElementById("ret").textContent =
    ((equity - 1) * 100).toFixed(2) + "%";


  document.getElementById("coins").textContent =
    success + "/" + symbols.length;


  status.textContent =
    "回测完成 · 成功读取 " +
    success +
    "/" +
    symbols.length +
    " 个币种";


  button.disabled = false;

  button.textContent =
    "重新开始回测";
}

</script>

</body>
</html>
