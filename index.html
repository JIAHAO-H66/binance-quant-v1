<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>山寨币合约 V1 回测器</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6f8;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",
    "Helvetica Neue",Arial,sans-serif;
  color:#111;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 3px 16px #0000000d;
}

h1{
  font-size:25px;
  margin:4px 0 8px;
}

h2{
  margin:0 0 14px;
}

h3{
  margin-top:0;
}

.muted{
  color:#70757d;
  font-size:14px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  font-size:17px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.metric{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.m{
  background:#f1f2f4;
  border-radius:13px;
  padding:12px;
}

.v{
  font-size:21px;
  font-weight:700;
  margin-top:5px;
}

.progress{
  width:100%;
  height:8px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#111;
  transition:width .3s;
}

.result{
  border-top:1px solid #eee;
  padding:12px 0;
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:15px;
}

.result:first-child{
  border-top:0;
}

.ok{
  color:#16803c;
}

.fail{
  color:#d92d20;
}

.loading{
  color:#666;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:13px;
  line-height:1.5;
  margin:0;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- 标题 -->
  <div class="card">

    <h1>Quant V1 · 山寨币合约回测</h1>

    <div class="muted">
      Binance USDT 永续 · 4H · 多空 · 公开行情数据 · 不下单
    </div>

    <br>

    <button id="go" onclick="run()">
      开始回测
    </button>

    <div class="progress">
      <div class="progress-bar" id="progress"></div>
    </div>

  </div>


  <!-- 总结果 -->
  <div class="card">

    <div id="status" class="muted">
      等待开始
    </div>

    <br>

    <div class="metric">

      <div class="m">
        交易次数
        <div class="v" id="trades">—</div>
      </div>

      <div class="m">
        胜率
        <div class="v" id="win">—</div>
      </div>

      <div class="m">
        组合收益
        <div class="v" id="ret">—</div>
      </div>

      <div class="m">
        币种
        <div class="v" id="coins">—</div>
      </div>

    </div>

  </div>


  <!-- 每个币种结果 -->
  <div class="card">

    <h2>币种回测结果</h2>

    <div id="results">
      <div class="muted">
        点击“开始回测”后显示结果
      </div>
    </div>

  </div>


  <!-- 策略 -->
  <div class="card">

    <h3>策略</h3>

    <pre>EMA50 / EMA200 趋势
20 根 4H 动量
ATR 1.5 倍止损
多空双向
基础手续费模拟 0.1%

仅用于研究，不代表未来收益</pre>

  </div>

</div>


<script>

/* =========================================================
   回测币种
========================================================= */

const symbols = [
  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "AVAXUSDT",
  "LINKUSDT",
  "SUIUSDT",
  "APTUSDT",
  "NEARUSDT",
  "INJUSDT"
];


/* =========================================================
   EMA
========================================================= */

function ema(a,n){

  if(!a || !a.length){
    return [];
  }

  const k = 2 / (n + 1);

  let e = a[0];

  const o = [e];

  for(let i = 1; i < a.length; i++){

    e = a[i] * k + e * (1 - k);

    o.push(e);
  }

  return o;
}


/* =========================================================
   从自己的服务器读取 Binance K线
   注意：
   这里已经不是直接访问 Binance。
   而是访问：
   
   https://你的域名/api/klines
========================================================= */

async function get(s){

  const u =
    "/api/klines" +
    "?symbol=" +
    encodeURIComponent(s) +
    "&interval=4h" +
    "&limit=1000";

  const r = await fetch(u, {
    method: "GET",
    cache: "no-store"
  });

  if(!r.ok){

    throw new Error(
      s + " HTTP " + r.status
    );
  }

  const x = await r.json();

  if(!Array.isArray(x)){

    throw new Error(
      s + " 数据格式错误"
    );
  }

  if(x.length < 250){

    throw new Error(
      s + " K线数量不足：" + x.length
    );
  }

  return x.map(z => ({

    h: Number(z[2]),

    l: Number(z[3]),

    c: Number(z[4])

  }));

}


/* =========================================================
   单个币种回测
========================================================= */

function calc(d){

  if(!d || d.length < 250){

    return [];
  }


  /* 收盘价 */

  const c = d.map(x => x.c);


  /* EMA */

  const e50 = ema(c,50);

  const e200 = ema(c,200);


  /* ATR */

  const atr = d.map((x,i) => {

    if(i < 13){

      return NaN;
    }

    let sum = 0;

    for(
      let j = i - 13;
      j <= i;
      j++
    ){

      sum += d[j].h - d[j].l;

    }

    return sum / 14;

  });


  /* 交易记录 */

  const tr = [];


  /* 当前仓位
     0 = 空仓
     1 = 多
    -1 = 空
  */

  let pos = 0;


  /* 入场价格 */

  let entry = 0;


  /* 开始回测 */

  for(let i = 200; i < d.length; i++){

    const mom =
      c[i] / c[i - 20] - 1;

    const a = atr[i];


    if(!isFinite(a)){

      continue;
    }


    /* =========================
       空仓 → 寻找开仓
    ========================= */

    if(!pos){

      /* 多头 */

      if(
        e50[i] > e200[i] &&
        mom > 0
      ){

        pos = 1;

        entry = c[i];

      }

      /* 空头 */

      else if(
        e50[i] < e200[i] &&
        mom < 0
      ){

        pos = -1;

        entry = c[i];

      }

    }


    /* =========================
       多头管理
    ========================= */

    else if(pos === 1){

      const stop =
        entry - 1.5 * a;

      const trendFail =
        !(e50[i] > e200[i] && mom > 0);


      if(
        c[i] <= stop ||
        trendFail
      ){

        const ret =
          (c[i] - entry) / entry - 0.001;

        tr.push(ret);

        pos = 0;

        entry = 0;

      }

    }


    /* =========================
       空头管理
    ========================= */

    else if(pos === -1){

      const stop =
        entry + 1.5 * a;

      const trendFail =
        !(e50[i] < e200[i] && mom < 0);


      if(
        c[i] >= stop ||
        trendFail
      ){

        const ret =
          (entry - c[i]) / entry - 0.001;

        tr.push(ret);

        pos = 0;

        entry = 0;

      }

    }

  }


  /* 如果最后还有仓位，
     用最后一根K线平仓 */

  if(pos !== 0 && entry > 0){

    const last =
      c[c.length - 1];

    let ret;

    if(pos === 1){

      ret =
        (last - entry) / entry - 0.001;

    }else{

      ret =
        (entry - last) / entry - 0.001;

    }

    tr.push(ret);

  }


  return tr;

}


/* =========================================================
   格式化收益
========================================================= */

function formatPercent(x){

  return (
    (x * 100).toFixed(2) +
    "%"
  );

}


/* =========================================================
   清空结果
========================================================= */

function resetUI(){

  document.getElementById("trades")
    .textContent = "—";

  document.getElementById("win")
    .textContent = "—";

  document.getElementById("ret")
    .textContent = "—";

  document.getElementById("coins")
    .textContent = "—";

  document.getElementById("results")
    .innerHTML = "";

  document.getElementById("progress")
    .style.width = "0%";

}


/* =========================================================
   显示币种结果
========================================================= */

function addResult(
  symbol,
  trades,
  error
){

  const box =
    document.getElementById("results");


  const row =
    document.createElement("div");

  row.className = "result";


  const name =
    document.createElement("div");

  name.textContent = symbol;


  const info =
    document.createElement("div");


  if(error){

    info.className = "fail";

    info.textContent =
      "失败： " + error;

  }else{

    info.className = "ok";

    if(trades.length){

      const wins =
        trades.filter(x => x > 0).length;

      const equity =
        trades.reduce(
          (v,x) => v * (1 + x),
          1
        );

      info.textContent =
        trades.length +
        " 笔 · 胜率 " +
        (wins / trades.length * 100)
          .toFixed(1) +
        "% · 收益 " +
        ((equity - 1) * 100)
          .toFixed(2) +
        "%";

    }else{

      info.textContent =
        "0 笔";

    }

  }


  row.appendChild(name);

  row.appendChild(info);

  box.appendChild(row);

}


/* =========================================================
   主回测
========================================================= */

async function run(){

  const button =
    document.getElementById("go");


  /* 防止重复点击 */

  button.disabled = true;

  button.textContent =
    "正在回测…";


  resetUI();


  const results =
    document.getElementById("results");

  results.innerHTML =
    '<div class="muted">正在连接服务器…</div>';


  let all = [];

  let done = 0;

  let success = 0;


  try{

    for(const s of symbols){

      document.getElementById("status")
        .textContent =
        "正在读取 " +
        s +
        " …";


      try{

        const data =
          await get(s);


        const trades =
          calc(data);


        all.push(...trades);


        success++;


        addResult(
          s,
          trades,
          null
        );


      }catch(e){

        addResult(
          s,
          [],
          e.message || "未知错误"
        );

      }


      done++;


      const percent =
        done / symbols.length * 100;


      document.getElementById("progress")
        .style.width =
        percent + "%";

    }


    /* =========================
       统计总结果
    ========================= */

    const equity =
      all.reduce(
        (v,x) => v * (1 + x),
        1
      );


    const wins =
      all.filter(
        x => x > 0
      ).length;


    document.getElementById("trades")
      .textContent =
      all.length;


    document.getElementById("win")
      .textContent =
      all.length
        ? (
            wins /
            all.length *
            100
          ).toFixed(1) + "%"
        : "—";


    document.getElementById("ret")
      .textContent =
      (
        (equity - 1) *
        100
      ).toFixed(2) + "%";


    document.getElementById("coins")
      .textContent =
      success + "/" + symbols.length;


    document.getElementById("status")
      .textContent =
      "回测完成 · 成功读取 " +
      success +
      "/" +
      symbols.length +
      " 个币种";


  }catch(e){

    document.getElementById("status")
      .textContent =
      "回测出现错误：" +
      (e.message || e);


  }finally{

    button.disabled = false;

    button.textContent =
      "重新开始回测";

  }

}

</script>

</body>
</html>
