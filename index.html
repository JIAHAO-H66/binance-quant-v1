<script>


/*
 * ============================
 * 基础参数
 * ============================
 */


const symbols = [

  "SOLUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "AVAXUSDT",
  "LINKUSDT",
  "SUIUSDT",
  "APTUSDT",
  "NEARUSDT",
  "INJUSDT"

];


const INITIAL_CAPITAL = 10000;


/*
 * 10个币种平均分配资金
 *
 * 10000 / 10 = 1000
 */

const CAPITAL_PER_COIN =
  INITIAL_CAPITAL / symbols.length;


/*
 * 手续费
 *
 * 开仓 0.1%
 * 平仓 0.1%
 */

const FEE_RATE = 0.001;


/*
 * ATR 止损倍数
 */

const ATR_MULTIPLIER = 1.5;


/*
 * EMA
 */

function ema(a,n){

  if(!a.length){
    return [];
  }

  const k =
    2 / (n + 1);

  let e = a[0];

  const out = [e];

  for(let i = 1; i < a.length; i++){

    e =
      a[i] * k +
      e * (1-k);

    out.push(e);
  }

  return out;
}


/*
 * ATR
 *
 * Wilder 风格之前我们简单平均，
 * 这里继续使用简单 TR 平均，
 * 保证结果容易理解。
 */

function atr(data,n=14){

  const out =
    new Array(data.length)
    .fill(NaN);

  for(let i=1;i<data.length;i++){

    const prevClose =
      data[i-1].close;

    const tr =
      Math.max(

        data[i].high -
        data[i].low,

        Math.abs(
          data[i].high -
          prevClose
        ),

        Math.abs(
          data[i].low -
          prevClose
        )

      );

    data[i]._tr = tr;
  }


  for(
    let i=n;
    i<data.length;
    i++
  ){

    let sum = 0;

    for(
      let j=i-n+1;
      j<=i;
      j++
    ){

      sum +=
        data[j]._tr || 0;

    }

    out[i] =
      sum / n;
  }

  return out;
}


/*
 * 单币种回测
 *
 * 每个币种独立使用1000 USDT。
 *
 * 最后再把10个币种的结果加起来。
 */

function calc(data,symbol){

  if(
    !data ||
    data.length < 220
  ){

    return {
      symbol,
      trades:[],
      finalCapital:CAPITAL_PER_COIN,
      returnPct:0,
      longTrades:0,
      shortTrades:0
    };

  }


  const c =
    data.map(x => x.close);

  const e50 =
    ema(c,50);

  const e200 =
    ema(c,200);

  const a =
    atr(data,14);


  const trades = [];


  /*
   * 0 = 无仓位
   * 1 = 多
   * -1 = 空
   */

  let pos = 0;


  let entry = 0;

  let stop = 0;

  let entryIndex = -1;


  /*
   * 从第200根K线开始
   */

  for(
    let i=200;
    i<data.length;
    i++
  ){

    if(
      !Number.isFinite(a[i])
    ){

      continue;

    }


    /*
     * 20根K线动量
     */

    const mom =
      c[i] /
      c[i-20] -
      1;


    /*
     * ==========================
     * 没有持仓
     * ==========================
     */

    if(pos === 0){


      /*
       * 多头条件
       */

      if(
        e50[i] >
        e200[i] &&
        mom > 0
      ){

        pos = 1;

        entry =
          c[i];

        entryIndex =
          i;


        /*
         * 固定止损
         *
         * 注意：
         * 这里只计算一次。
         */

        stop =
          entry -
          ATR_MULTIPLIER *
          a[i];


        continue;
      }


      /*
       * 空头条件
       */

      if(
        e50[i] <
        e200[i] &&
        mom < 0
      ){

        pos = -1;

        entry =
          c[i];

        entryIndex =
          i;


        /*
         * 固定止损
         */

        stop =
          entry +
          ATR_MULTIPLIER *
          a[i];


        continue;
      }

    }


    /*
     * ==========================
     * 多头
     * ==========================
     */

    if(pos === 1){

      /*
       * 用K线最低价判断
       * 是否碰到止损。
       */

      const stopHit =
        data[i].low <= stop;


      const trendBroken =
        !(
          e50[i] >
          e200[i] &&
          mom > 0
        );


      /*
       * 优先按照止损处理。
       */

      if(stopHit){

        const exit =
          stop;


        const gross =
          (exit-entry) /
          entry;


        /*
         * 开仓手续费
         * +
         * 平仓手续费
         */

        const net =
          gross -
          FEE_RATE -
          FEE_RATE;


        trades.push({

          symbol,

          side:"LONG",

          entry,

          exit,

          ret:net,

          entryIndex,

          exitIndex:i,

          reason:"ATR STOP"

        });


        pos=0;

        entry=0;

        stop=0;

        entryIndex=-1;


        continue;
      }


      /*
       * 趋势反转
       */

      if(trendBroken){

        const exit =
          c[i];


        const gross =
          (exit-entry) /
          entry;


        const net =
          gross -
          FEE_RATE -
          FEE_RATE;


        trades.push({

          symbol,

          side:"LONG",

          entry,

          exit,

          ret:net,

          entryIndex,

          exitIndex:i,

          reason:"TREND"

        });


        pos=0;

        entry=0;

        stop=0;

        entryIndex=-1;

      }

    }


    /*
     * ==========================
     * 空头
     * ==========================
     */

    else if(pos === -1){

      /*
       * 空头止损：
       * K线最高价碰到止损。
       */

      const stopHit =
        data[i].high >= stop;


      const trendBroken =
        !(
          e50[i] <
          e200[i] &&
          mom < 0
        );


      /*
       * 止损优先
       */

      if(stopHit){

        const exit =
          stop;


        const gross =
          (entry-exit) /
          entry;


        const net =
          gross -
          FEE_RATE -
          FEE_RATE;


        trades.push({

          symbol,

          side:"SHORT",

          entry,

          exit,

          ret:net,

          entryIndex,

          exitIndex:i,

          reason:"ATR STOP"

        });


        pos=0;

        entry=0;

        stop=0;

        entryIndex=-1;


        continue;
      }


      /*
       * 趋势反转
       */

      if(trendBroken){

        const exit =
          c[i];


        const gross =
          (entry-exit) /
          entry;


        const net =
          gross -
          FEE_RATE -
          FEE_RATE;


        trades.push({

          symbol,

          side:"SHORT",

          entry,

          exit,

          ret:net,

          entryIndex,

          exitIndex:i,

          reason:"TREND"

        });


        pos=0;

        entry=0;

        stop=0;

        entryIndex=-1;

      }

    }

  }


  /*
   * ==========================
   * 最后一笔未平仓交易
   * ==========================
   */

  if(pos !== 0){

    const i =
      data.length-1;

    const exit =
      c[i];


    let gross;


    if(pos === 1){

      gross =
        (exit-entry) /
        entry;

    }else{

      gross =
        (entry-exit) /
        entry;

    }


    const net =
      gross -
      FEE_RATE -
      FEE_RATE;


    trades.push({

      symbol,

      side:
        pos === 1
          ? "LONG"
          : "SHORT",

      entry,

      exit,

      ret:net,

      entryIndex,

      exitIndex:i,

      reason:"END"

    });

  }


  /*
   * ==========================
   * 计算该币种资金
   * ==========================
   */

  let capital =
    CAPITAL_PER_COIN;


  for(const trade of trades){

    capital *=
      1 + trade.ret;

  }


  const returnPct =
    (
      capital /
      CAPITAL_PER_COIN -
      1
    ) * 100;


  return {

    symbol,

    trades,

    finalCapital:capital,

    returnPct,

    longTrades:
      trades.filter(
        x => x.side === "LONG"
      ).length,

    shortTrades:
      trades.filter(
        x => x.side === "SHORT"
      ).length

  };

}


/*
 * ============================
 * 从服务器获取行情
 * ============================
 */

async function get(symbol){

  const url =
    "/api/klines" +
    "?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=4h" +
    "&limit=1000";


  const response =
    await fetch(
      url,
      {
        method:"GET",
        cache:"no-store"
      }
    );


  let result;


  try{

    result =
      await response.json();

  }catch{

    throw new Error(
      symbol +
      "：服务器返回格式错误"
    );

  }


  if(
    !response.ok ||
    !result.ok
  ){

    throw new Error(

      result.error ||
      symbol +
      " HTTP " +
      response.status

    );

  }


  if(
    !Array.isArray(result.data) ||
    result.data.length === 0
  ){

    throw new Error(
      symbol +
      "：没有行情数据"
    );

  }


  return result.data;

}


/*
 * ============================
 * 添加结果
 * ============================
 */

function addResult(
  symbol,
  text,
  cls
){

  const box =
    document.getElementById(
      "results"
    );


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "coin";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "coin-name";


  name.textContent =
    symbol;


  const result =
    document.createElement(
      "div"
    );


  result.className =
    "coin-result " +
    (cls || "");


  result.textContent =
    text;


  row.appendChild(name);

  row.appendChild(result);

  box.appendChild(row);


  return result;

}


/*
 * ============================
 * 格式化金额
 * ============================
 */

function money(n){

  return n.toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/*
 * ============================
 * 主回测
 * ============================
 */

async function run(){

  const button =
    document.getElementById(
      "go"
    );


  const status =
    document.getElementById(
      "status"
    );


  const results =
    document.getElementById(
      "results"
    );


  const progress =
    document.getElementById(
      "progressBar"
    );


  /*
   * 禁止重复点击
   */

  button.disabled =
    true;


  button.textContent =
    "正在回测……";


  results.innerHTML =
    "";


  progress.style.width =
    "0%";


  /*
   * 重置
   */

  document.getElementById(
    "initial"
  ).textContent =
    money(
      INITIAL_CAPITAL
    );


  document.getElementById(
    "final"
  ).textContent =
    "—";


  document.getElementById(
    "ret"
  ).textContent =
    "—";


  document.getElementById(
    "drawdown"
  ).textContent =
    "—";


  document.getElementById(
    "trades"
  ).textContent =
    "—";


  document.getElementById(
    "win"
  ).textContent =
    "—";


  document.getElementById(
    "pf"
  ).textContent =
    "—";


  document.getElementById(
    "coins"
  ).textContent =
    "0/" +
    symbols.length;


  /*
   * 保存每个币种结果
   */

  const coinResults = [];


  let success = 0;


  /*
   * ==========================
   * 一个一个币种回测
   * ==========================
   */

  for(
    let i=0;
    i<symbols.length;
    i++
  ){

    const symbol =
      symbols[i];


    status.textContent =
      "正在读取 " +
      symbol +
      " ……";


    const currentStatus =
      addResult(
        symbol,
        "读取中……",
        "running"
      );


    try{

      /*
       * 获取行情
       */

      const data =
        await get(symbol);


      /*
       * 回测
       */

      const result =
        calc(
          data,
          symbol
        );


      coinResults.push(
        result
      );


      success++;


      const resultClass =
        result.returnPct >= 0
          ? "positive"
          : "negative";


      currentStatus.className =
        "coin-result " +
        resultClass;


      const sign =
        result.returnPct >= 0
          ? "+"
          : "";


      currentStatus.textContent =
        "成功 · " +
        data.length +
        " 根K线 · " +
        result.trades.length +
        " 笔交易 · " +
        sign +
        result.returnPct.toFixed(2) +
        "%";


    }catch(err){

      currentStatus.className =
        "coin-result fail";


      currentStatus.textContent =
        "失败：" +
        err.message;

    }


    /*
     * 更新进度
     */

    const percent =
      (
        (i+1) /
        symbols.length
      ) * 100;


    progress.style.width =
      percent + "%";


    document.getElementById(
      "coins"
    ).textContent =
      success +
      "/" +
      symbols.length;

  }


  /*
   * ==========================
   * 汇总所有交易
   * ==========================
   */

  const allTrades = [];


  for(
    const result of coinResults
  ){

    for(
      const trade of result.trades
    ){

      allTrades.push(
        trade
      );

    }

  }


  /*
   * ==========================
   * 最终资金
   *
   * 每个币种自己的1000 USDT
   * 独立复利。
   *
   * 最后再相加。
   * ==========================
   */

  let finalCapital = 0;


  for(
    const result of coinResults
  ){

    finalCapital +=
      result.finalCapital;

  }


  /*
   * ==========================
   * 总收益
   * ==========================
   */

  const totalReturn =
    (
      finalCapital /
      INITIAL_CAPITAL -
      1
    ) * 100;


  /*
   * ==========================
   * 胜率
   * ==========================
   */

  const wins =
    allTrades.filter(
      x => x.ret > 0
    ).length;


  const winRate =
    allTrades.length
      ? wins /
        allTrades.length *
        100
      : 0;


  /*
   * ==========================
   * Profit Factor
   *
   * 总盈利 / 总亏损绝对值
   * ==========================
   */

  let grossProfit = 0;

  let grossLoss = 0;


  for(
    const trade of allTrades
  ){

    if(trade.ret > 0){

      grossProfit +=
        trade.ret;

    }else{

      grossLoss +=
        Math.abs(
          trade.ret
        );

    }

  }


  const profitFactor =
    grossLoss > 0
      ? grossProfit /
        grossLoss
      : 0;


  /*
   * ==========================
   * 最大回撤
   *
   * 使用“已实现交易结果”
   * 构建组合资金曲线。
   *
   * 每个币种开始时都有1000。
   * ==========================
   */

  const equityByCoin = {};


  for(
    const result of coinResults
  ){

    equityByCoin[
      result.symbol
    ] =
      CAPITAL_PER_COIN;

  }


  /*
   * 按退出K线排序。
   *
   * 由于10个币种的K线
   * 时间基本同步，
   * 这里使用 exitIndex
   * 做组合曲线。
   */

  const sortedTrades =
    [...allTrades].sort(
      (a,b) =>
        a.exitIndex -
        b.exitIndex
    );


  let equity =
    INITIAL_CAPITAL;


  let peak =
    INITIAL_CAPITAL;


  let maxDrawdown = 0;


  for(
    const trade of sortedTrades
  ){

    const oldCapital =
      equityByCoin[
        trade.symbol
      ] ||
      CAPITAL_PER_COIN;


    const newCapital =
      oldCapital *
      (1 + trade.ret);


    equityByCoin[
      trade.symbol
    ] =
      newCapital;


    /*
     * 重新计算组合资金
     */

    equity = 0;


    for(
      const symbol of
      Object.keys(equityByCoin)
    ){

      equity +=
        equityByCoin[
          symbol
        ];

    }


    /*
     * 峰值
     */

    if(
      equity > peak
    ){

      peak =
        equity;

    }


    /*
     * 回撤
     */

    const dd =
      (
        peak -
        equity
      ) /
      peak;


    if(
      dd > maxDrawdown
    ){

      maxDrawdown =
        dd;

    }

  }


  /*
   * ==========================
   * 显示最终结果
   * ==========================
   */

  document.getElementById(
    "final"
  ).textContent =
    money(
      finalCapital
    ) +
    " USDT";


  document.getElementById(
    "ret"
  ).textContent =
    (
      totalReturn >= 0
        ? "+"
        : ""
    ) +
    totalReturn.toFixed(2) +
    "%";


  document.getElementById(
    "drawdown"
  ).textContent =
    (
      maxDrawdown *
      100
    ).toFixed(2) +
    "%";


  document.getElementById(
    "trades"
  ).textContent =
    allTrades.length;


  document.getElementById(
    "win"
  ).textContent =
    allTrades.length
      ? winRate.toFixed(1) +
        "%"
      : "—";


  document.getElementById(
    "pf"
  ).textContent =
    profitFactor
      ? profitFactor.toFixed(2)
      : "—";


  document.getElementById(
    "coins"
  ).textContent =
    success +
    "/" +
    symbols.length;


  /*
   * 收益颜色
   */

  const retElement =
    document.getElementById(
      "ret"
    );


  retElement.className =
    "v " +
    (
      totalReturn >= 0
        ? "positive"
        : "negative"
    );


  /*
   * 完成
   */

  status.textContent =
    "回测完成 · 成功读取 " +
    success +
    "/" +
    symbols.length +
    " 个币种";


  button.disabled =
    false;


  button.textContent =
    "重新开始回测";

}


</script>


</body>

</html>
